<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRODE Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#13151a;
    --pitch-mid:#1a1e26;
    --pitch-line:rgba(255,255,255,0.07);
    --chalk:#e7e9ee;
    --chalk-dim:#969faa;
    --amber:#e0b04e;
    --amber-soft:rgba(224,176,78,0.10);
    --amber-dim:#a57a33;
    --red:#d86452;
    --green-ok:#8aa98f;
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{font-size:16px;}
  body{
    margin:0;
    background:var(--pitch-dark);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(48px + env(safe-area-inset-bottom));}
  h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:0.02em;margin:0;line-height:1.1;}
  h1{font-size:1.9rem;color:var(--amber);font-weight:400;}
  h2{font-size:1.35rem;color:var(--chalk);margin-bottom:12px;font-weight:400;}
  h3{font-size:1.1rem;color:var(--chalk);font-weight:400;}
  .subtitle{color:var(--chalk-dim);font-size:0.85rem;margin-top:3px;word-break:break-word;}
  .topbar{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--pitch-line);padding-bottom:12px;margin-bottom:4px;}
  .fecha-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .fecha-row select{flex:1 1 0;min-width:0;width:auto;}

  input,select,textarea{
    font-family:'Inter',sans-serif;
    background:rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--chalk);
    border-radius:8px;
    padding:0 12px;
    font-size:16px;
    width:100%;
    min-height:var(--tap);
    transition:border-color .15s ease;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber-dim);}
  input::placeholder, textarea::placeholder{color:var(--chalk-dim);}
  textarea{padding:10px 12px;min-height:100px;resize:vertical;line-height:1.4;}
  input[type=checkbox]{width:20px;height:20px;min-height:20px;padding:0;accent-color:var(--amber);}

  button{
    cursor:pointer;
    background:var(--amber);
    color:#191510;
    font-weight:600;
    border:none;
    border-radius:8px;
    min-height:var(--tap);
    padding:0 18px;
    font-size:16px;
    transition:transform .08s ease, filter .15s ease, opacity .15s ease;
  }
  button:hover{filter:brightness(1.06);}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.5;pointer-events:none;}
  button.ghost{background:transparent;color:var(--chalk);border:1px solid rgba(255,255,255,0.18);}
  button.ghost:hover{background:rgba(255,255,255,0.05);filter:none;}
  button.danger{background:var(--red);color:#fff;}
  button.small{min-height:36px;padding:0 12px;font-size:0.85rem;border-radius:6px;}
  .btn-block{width:100%;}
  .del-btn{background:transparent;color:var(--red);border:none;min-width:36px;min-height:var(--tap);padding:0;font-size:1.1rem;border-radius:8px;}
  .del-btn:hover{background:rgba(201,124,106,0.08);filter:none;}

  nav.tabs{
    display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;
    border-bottom:1px solid var(--pitch-line);
    position:sticky;top:0;z-index:10;
    background:rgba(19,21,26,0.96);
    backdrop-filter:blur(6px);
    margin:0 -14px 16px;padding:8px 14px 0;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    background:transparent;color:var(--chalk-dim);border-radius:8px 8px 0 0;
    padding:0 15px;min-height:42px;flex:0 0 auto;white-space:nowrap;
    font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:0.04em;
    border-bottom:2px solid transparent;
  }
  nav.tabs button:hover{color:var(--chalk);background:rgba(255,255,255,0.03);}
  nav.tabs button.active{background:var(--amber-soft);color:var(--amber);border-bottom-color:var(--amber);}

  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    border:1px solid var(--pitch-line);
    border-radius:12px;
    padding:16px;
    margin-bottom:14px;
  }
  .empty{
    text-align:center;padding:44px 20px;color:var(--chalk-dim);
    border:1px dashed rgba(255,255,255,0.16);border-radius:14px;
  }
  .empty .col{max-width:340px;margin:16px auto 0;}
  .col{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .col:last-child{margin-bottom:0;}
  .col label{font-size:0.72rem;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;}
  .row-inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .grid-form{display:grid;gap:12px;}
  .flexbetween{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .muted{color:var(--chalk-dim);}
  .over-wc{color:var(--red);font-weight:600;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .num-badge{
    font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:600;text-align:center;font-size:0.95rem;
  }
  .wc-tag{
    font-size:0.6rem;background:var(--amber);color:#191510;padding:1px 5px;border-radius:20px;font-weight:700;margin-left:3px;
    display:inline-block;vertical-align:middle;
  }
  .sep{color:var(--chalk-dim);text-align:center;}

  .match-row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--pitch-line);}
  .match-row input{min-width:0;}

  .score-input{width:54px;min-width:54px;padding:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:600;border-radius:8px;justify-self:center;}

  .res-row{display:grid;grid-template-columns:26px minmax(0,1fr) 54px 12px 54px minmax(0,1fr);gap:6px;align-items:center;padding:10px 8px;margin:0 -8px;border-bottom:1px solid var(--pitch-line);}
  .res-row.loaded{background:rgba(138,169,143,0.08);}
  .res-row .team{font-size:0.92rem;line-height:1.2;overflow-wrap:anywhere;}
  .res-row .score-input{justify-self:center;}

  .pred-row{display:grid;grid-template-columns:26px minmax(0,1fr) 48px 12px 48px 42px;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--pitch-line);}
  .pred-row .teams{font-size:0.84rem;line-height:1.25;overflow-wrap:anywhere;color:var(--chalk);}
  .pred-row .teams .vs{color:var(--chalk-dim);margin:0 4px;font-size:0.7rem;}
  .chk{display:flex;align-items:center;justify-content:center;gap:2px;font-size:0.78rem;color:var(--chalk-dim);white-space:nowrap;min-height:var(--tap);cursor:pointer;}
  .chk input{margin:0;}

  .participant-block{border:1px solid var(--pitch-line);border-radius:10px;padding:12px;margin-bottom:12px;background:rgba(0,0,0,0.14);}
  .participant-block h3{font-size:1.1rem;margin:0;}
  .participant-head{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .participant-head:hover{opacity:0.85;}
  .ph-left{display:flex;align-items:center;gap:8px;min-width:0;}
  .ph-chev{color:var(--amber);font-size:0.8rem;flex:0 0 auto;}
  .ph-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .ph-summary{font-size:0.72rem;color:var(--chalk-dim);white-space:nowrap;}

  .stand-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--pitch-line);}
  .stand-pos{
    font-family:'JetBrains Mono',monospace;color:var(--chalk-dim);font-weight:700;text-align:center;
    background:rgba(255,255,255,0.05);border-radius:8px;min-height:34px;display:flex;align-items:center;justify-content:center;
  }
  .stand-pos.pos-1{color:var(--amber);background:var(--amber-soft);}
  .stand-main{min-width:0;}
  .stand-name{font-weight:600;font-size:1rem;overflow-wrap:anywhere;}
  .stand-sub{color:var(--chalk-dim);font-size:0.75rem;margin-top:3px;}
  .stand-pts{font-size:1.5rem;font-weight:700;color:var(--amber);font-family:'JetBrains Mono',monospace;}

  .ticket{
    background:repeating-linear-gradient(90deg, transparent, transparent 8px, rgba(255,255,255,0.3) 8px, rgba(255,255,255,0.3) 9px) top/100% 1px no-repeat,
      linear-gradient(180deg,#191c23,#14161c);
    border:1px solid rgba(255,255,255,0.13);
    border-radius:10px;
    padding:16px;
    position:relative;
    overflow:hidden;
  }
  .ticket::before, .ticket::after{
    content:"";position:absolute;width:18px;height:18px;background:var(--pitch-dark);border-radius:50%;
    top:50%;transform:translateY(-50%);
  }
  .ticket::before{left:-9px;} .ticket::after{right:-9px;}
  pre.copytext{white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',monospace;font-size:0.86rem;line-height:1.5;color:var(--chalk);margin:0;}
  textarea.readonly-copy{min-height:200px;overflow-wrap:anywhere;word-break:break-word;font-family:'JetBrains Mono',monospace;font-size:0.86rem;line-height:1.5;}

  .toast{
    position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:var(--green-ok);color:#14161a;padding:10px 18px;border-radius:18px;font-weight:600;
    font-size:0.85rem;box-shadow:0 4px 16px rgba(0,0,0,0.4);z-index:99;opacity:0;transition:opacity .25s ease;pointer-events:none;
    max-width:92vw;text-align:center;
  }
  .toast.show{opacity:1;}
  hr.sep{border:none;border-top:1px solid var(--pitch-line);margin:14px 0;}

  @media (min-width:720px){
    .wrap{padding:24px 24px 60px;}
    .topbar{flex-direction:row;justify-content:space-between;align-items:flex-end;padding-bottom:14px;margin-bottom:16px;}
    h1{font-size:2.2rem;}
    h2{font-size:1.4rem;}
    nav.tabs{margin:0 -24px 18px;padding:8px 24px 0;}
    .fecha-row select{flex:0 1 auto;}
    .grid-form{grid-template-columns:repeat(2,1fr);}
    .card{padding:18px;}
    .match-row{gap:12px;padding:10px 0;}
    .res-row{gap:10px;}
    .pred-row{gap:10px;}
    .btn-block{width:auto;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
let prodeIndex = [];
let currentId = null;
let current = null; // full prode data object
let activeTab = 'fixture';
let aiBusyName = null;
let previewText = '';
let participantesAbiertos = new Set();

const $ = (sel, root=document) => root.querySelector(sel);

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------- storage (via /api/data, backed by Supabase) ----------
async function storageGet(key){
  const r = await fetch('/api/data?key=' + encodeURIComponent(key));
  if(r.status===404) return null;
  if(!r.ok) throw new Error('Error al leer datos guardados');
  const d = await r.json();
  return { key: d.key, value: JSON.stringify(d.value) };
}
async function storageSet(key, valueString){
  const parsed = JSON.parse(valueString);
  const r = await fetch('/api/data', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ key, value: parsed })
  });
  if(!r.ok) throw new Error('Error al guardar datos');
  return r.json();
}
async function storageDelete(key){
  const r = await fetch('/api/data?key=' + encodeURIComponent(key), { method:'DELETE' });
  return r.ok;
}

// ---------- storage ----------
async function loadIndex(){
  try{
    const r = await storageGet('prode-index');
    prodeIndex = r ? JSON.parse(r.value) : [];
  }catch(e){ prodeIndex = []; }
}
async function saveIndex(){
  await storageSet('prode-index', JSON.stringify(prodeIndex));
}
async function loadProde(id){
  try{
    const r = await storageGet('prode-data:' + id);
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveProde(){
  if(!current) return;
  await storageSet('prode-data:' + current.id, JSON.stringify(current));
}

function defaultProde(name){
  return {
    id: uid(),
    name: name || 'Fecha sin nombre',
    encabezado: 'EL PRODE QUE VIENE.',
    cierre: 'CIERRA VIERNES 19.30.',
    precio: '2 MIL PESOS.',
    comodinesTexto: '5 COMODINES',
    comodinesPermitidos: 5,
    matches: [],
    participants: {}
  };
}

// ---------- fixture parsing ----------
function parseFixtureText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const seps = [' – ', ' - ', ' vs ', ' VS ', ' Vs ', '–', '-'];
  const matches = [];
  for(const line of lines){
    // strip leading numbering like "1--", "1-", "1)", "1."
    let clean = line.replace(/^\d+\s*[-–.).]*\s*/,'').trim();
    let teamA=null, teamB=null;
    for(const sep of seps){
      if(clean.includes(sep)){
        const parts = clean.split(sep);
        if(parts.length>=2){
          teamA = parts[0].trim();
          teamB = parts.slice(1).join(sep).trim();
          break;
        }
      }
    }
    if(teamA && teamB){
      matches.push({number: matches.length+1, teamA, teamB, golesA:null, golesB:null});
    }
  }
  return matches;
}

// ---------- AI parsing of predictions ----------
function extractPredictionsLenient(text){
  const preds = [];
  const arrMatch = text.match(/"predicciones"\s*:\s*\[([\s\S]*?)\]/);
  const body = arrMatch ? arrMatch[1] : text;
  const objRe = /\{\s*"numero"\s*:\s*(\d+)([\s\S]*?)\}/g;
  let m;
  while((m = objRe.exec(body)) !== null){
    const numero = Number(m[1]);
    const a = m[2].match(/"golesA"\s*:\s*(-?\d+)/);
    const b = m[2].match(/"golesB"\s*:\s*(-?\d+)/);
    if(a && b) preds.push({ numero, golesA: Number(a[1]), golesB: Number(b[1]) });
  }
  const com = [];
  const cm = text.match(/"comodines"\s*:\s*\[([\s\S]*?)\]/);
  if(cm){
    const nums = cm[1].match(/-?\d+/g) || [];
    for(const n of nums){
      const num = Number(n);
      if(!com.includes(num)) com.push(num);
    }
  }
  return { predicciones: preds, comodines: com };
}

function parseModelJSON(text){
  const cleaned = (text||'').replace(/```json|```/g,'').trim();
  const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
  if(!jsonMatch){
    const lenient = extractPredictionsLenient(cleaned);
    if(lenient.predicciones.length) return lenient;
    throw new Error('La IA no devolvió un objeto JSON válido. Respuesta (primeros 400 caracteres): ' + cleaned.slice(0,400));
  }
  const raw = jsonMatch[0];
  const variants = [
    raw,
    raw.replace(/,\s*([}\]])/g,'$1'),
    raw.replace(/([}\]])\s*([{\[])/g,'$1,$2'),
    raw.replace(/,\s*([}\]])/g,'$1').replace(/([}\]])\s*([{\[])/g,'$1,$2')
  ];
  let firstError = null;
  for(const v of variants){
    try{ return JSON.parse(v); }catch(e){ if(!firstError) firstError = e.message; }
  }
  const lenient = extractPredictionsLenient(raw);
  if(lenient.predicciones.length || lenient.comodines.length) return lenient;
  throw new Error('La IA devolvió JSON inválido (' + firstError + '). Respuesta (' + raw.length + ' caracteres, primeros 400): ' + raw.slice(0,400));
}

function normalizePredictionsData(obj){
  const out = { predicciones: [], comodines: [] };
  if(Array.isArray(obj.predicciones)){
    const seen = new Set();
    for(const item of obj.predicciones){
      if(!item || typeof item !== 'object' || !Number.isFinite(Number(item.numero))) continue;
      const numero = Number(item.numero);
      if(seen.has(numero)) continue;
      seen.add(numero);
      out.predicciones.push({
        numero,
        golesA: Number.isFinite(Number(item.golesA)) ? Number(item.golesA) : null,
        golesB: Number.isFinite(Number(item.golesB)) ? Number(item.golesB) : null
      });
    }
  }
  if(Array.isArray(obj.comodines)){
    const seen = new Set();
    for(const n of obj.comodines){
      const num = Number(n);
      if(Number.isFinite(num) && !seen.has(num)){ seen.add(num); out.comodines.push(num); }
    }
  }
  return out;
}

// ---------- deterministic local parsing (no AI, no quota) ----------
function normText(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }

function splitTeamScore(text, teamNames){
  const t = normText(text);
  let bestName = null, bestLen = 0;
  for(const name of teamNames){
    const n = normText(name);
    if(t.startsWith(n) && n.length > bestLen){ bestName = name; bestLen = n.length; }
  }
  if(!bestName) return { team:null, score:null };
  const rest = t.slice(bestLen).trim();
  const sm = rest.match(/^(\d+)$/);
  return { team:bestName, score: sm ? Number(sm[1]) : null };
}

function findMatchByTeams(leftName, rightName, matches){
  const a = normText(leftName), b = normText(rightName);
  for(const m of matches){
    if(normText(m.teamA)===a && normText(m.teamB)===b) return { numero:m.number, swap:false };
  }
  for(const m of matches){
    if(normText(m.teamA)===b && normText(m.teamB)===a) return { numero:m.number, swap:true };
  }
  return null;
}

function cleanLine(line){
  return line
    .replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\u2022\u00B7\u2023]/gu,'')
    .replace(/[~_]/g,'')
    .replace(/\*/g,'')
    .replace(/\.*\s*comod[ií]n\s*/gi,'')
    .replace(/(^|\s)[Cc](\s|$)/g,'$1$2')
    .replace(/[.\s]+$/,'')
    .trim();
}

const TEAM_NAME_CHAR = "[A-Za-zÁÉÍÓÚÜáéíóúüÑñ.'()]";
const TEAM_NAME_SEQ = TEAM_NAME_CHAR + "+(?:\\s+" + TEAM_NAME_CHAR + "+)*";
const RE_TEAM_SCORES = new RegExp(
  "^(.+?)\\s+(\\d{1,2})\\s*(?:[=:–-]|vs\\.?|\\ba\\b)?\\s*(" + TEAM_NAME_SEQ + ")\\s+(\\d{1,2})$", 'i');
const RE_TEAM_SCORES_TOGETHER = new RegExp(
  "^(.+?)\\s+(\\d{1,2})\\s*(?:[=:–-]|vs\\.?|\\ba\\b)\\s*(\\d{1,2})\\s+(" + TEAM_NAME_SEQ + ")$", 'i');

function fuzzyNorm(s){ return normText(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }

function fuzzySim(a, b){
  a = fuzzyNorm(a); b = fuzzyNorm(b);
  if(!a || !b) return 0;
  if(a === b) return 1;
  const min = Math.min(a.length, b.length);
  let i = 0;
  while(i < min && a[i] === b[i]) i++;
  const prefix = i / min;
  let contain = 0;
  if(a.includes(b) || b.includes(a)) contain = Math.min(a.length, b.length) / Math.max(a.length, b.length);
  return Math.max(prefix, contain);
}

function fuzzyFindMatchByTeams(leftName, rightName, matches){
  const scored = [];
  for(const m of matches){
    const normal = (fuzzySim(leftName, m.teamA) + fuzzySim(rightName, m.teamB)) / 2;
    const swapped = (fuzzySim(leftName, m.teamB) + fuzzySim(rightName, m.teamA)) / 2;
    scored.push({ m, swap: swapped > normal, score: Math.max(normal, swapped) });
  }
  scored.sort((a,b)=>b.score-a.score);
  const best = scored[0];
  if(!best || best.score < 0.6) return null;
  const second = scored[1] ? scored[1].score : 0;
  if(best.score > second + 0.25) return { numero: best.m.number, swap: best.swap };
  return null;
}

function resolveTeamMatch(leftName, rightName, numero, matches){
  const mt = findMatchByTeams(leftName, rightName, matches) || fuzzyFindMatchByTeams(leftName, rightName, matches);
  if(!mt) return null;
  return { numero: numero !== null ? numero : mt.numero, swap: mt.swap };
}

function parsePredictionsLocal(rawText, matches){
  const byNum = new Map();
  const comos = new Set();
  const teamNames = [];
  for(const m of matches){ teamNames.push(m.teamA); teamNames.push(m.teamB); }
  const lines = rawText.split('\n').map(l=>l.trim()).filter(Boolean);
  let inOrder = 1;

  for(const rawLine of lines){
    if(!/\d/.test(rawLine)) continue;
    const isWc = /comod[ií]n|\*|(^|\s)[Cc](\s|$)/i.test(rawLine);
    let line = cleanLine(rawLine);
    if(!line) continue;

    let numero = null;
    let body = line;
    let numMatch = line.match(/^(\d{1,2})\s*[-–.)]{1,2}(?=\s)/);
    if(!numMatch) numMatch = line.match(/^(\d{1,2})\s+(?=[A-Za-zÁÉÍÓÚÜáéíóúüÑñ])/);
    if(numMatch){
      numero = Number(numMatch[1]);
      body = line.slice(numMatch[0].length).trim();
    }

    let ga = null, gb = null;
    let teamBased = false;

    // 1) TeamA S1 [sep] TeamB S2   o   TeamA S1 sep S2 TeamB
    const mt1 = body.match(RE_TEAM_SCORES);
    const mt2 = mt1 ? null : body.match(RE_TEAM_SCORES_TOGETHER);
    if(mt1 || mt2){
      teamBased = true;
      const leftName = mt1 ? mt1[1] : mt2[1];
      const rightName = mt1 ? mt1[3] : mt2[4];
      ga = Number(mt1 ? mt1[2] : mt2[2]);
      gb = Number(mt1 ? mt1[4] : mt2[3]);
      const mt = resolveTeamMatch(leftName, rightName, numero, matches);
      if(mt){
        numero = mt.numero;
        if(mt.swap){ const t = ga; ga = gb; gb = t; }
      }
    }

    // 2) split numerico o equipo+goles (fallback legacy)
    if(ga === null){
      const parts = body.split(/\s*[=–-]\s*/).map(s=>s.trim()).filter(Boolean);
      if(parts.length === 2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])){
        ga = Number(parts[0]); gb = Number(parts[1]);
      }else if(parts.length === 2){
        const left = splitTeamScore(parts[0], teamNames);
        const right = splitTeamScore(parts[1], teamNames);
        if(left.team && right.team && typeof left.score === 'number' && typeof right.score === 'number'){
          teamBased = true;
          ga = left.score; gb = right.score;
          const mt = resolveTeamMatch(left.team, right.team, numero, matches);
          if(mt){
            numero = mt.numero;
            if(mt.swap){ const t = ga; ga = gb; gb = t; }
          }
        }
      }
    }

    // 3) dos numeros puros sin separador: "1) 2 1"
    if(ga === null && numero !== null){
      const two = body.match(/^(\d{1,2})\s+(\d{1,2})$/);
      if(two){ ga = Number(two[1]); gb = Number(two[2]); }
    }

    // 4) multiples pares de goles en la linea: "2-1 0-0"
    if(ga === null){
      const scores = [...body.matchAll(/(\d+)\s*[-–:x=]\s*(\d+)/g)];
      if(scores.length){
        for(const s of scores){
          const n = numero || inOrder++;
          if(n >= 1 && n <= matches.length){
            byNum.set(n, { numero:n, golesA:Number(s[1]), golesB:Number(s[2]) });
            if(isWc) comos.add(n);
          }
        }
        continue;
      }
    }

    // 5) ultimo recurso: digitos a ambos lados de un separador
    if(ga === null){
      const sepIdx = body.search(/[=–-]/);
      if(sepIdx >= 0){
        const leftP = body.slice(0, sepIdx);
        const rightP = body.slice(sepIdx).replace(/^[=–-\s]+/,'');
        const ln = leftP.match(/(\d+)\s*$/);
        const rn = rightP.match(/(\d+)\s*$/);
        if(ln && rn){ ga = Number(ln[1]); gb = Number(rn[1]); }
      }
    }

    if(ga === null) continue;
    if(teamBased && numero === null) continue;
    const n = numero || inOrder++;
    if(n >= 1 && n <= matches.length){
      byNum.set(n, { numero:n, golesA:ga, golesB:gb });
      if(isWc) comos.add(n);
    }
  }

  return {
    predicciones: Array.from(byNum.values()).sort((a,b)=>a.numero-b.numero),
    comodines: Array.from(comos).sort((a,b)=>a-b)
  };
}

async function parsePredictionsWithAI(rawText, matches){
  const fixtureList = matches.map(m=>`${m.number}: ${m.teamA} - ${m.teamB}`).join('\n');
  const prompt = `Sos un asistente que extrae pronósticos de resultados de fútbol de un mensaje de WhatsApp y los devuelve como JSON.

Partidos del fixture (numero: equipoA - equipoB):
${fixtureList}

Mensaje del participante:
"""
${rawText}
"""

El mensaje es una lista de pronósticos. Cada línea puede tener el número de partido (1, 1), 1--, 1., 1-), los equipos, el resultado y a veces la marca COMODIN (o comodín, C, *, negrita).

EJEMPLO: si el mensaje dice "1-- ROSARIO CENTRAL 2 – ALDOSIVI 0 COMODIN", entonces numero=1, golesA=2, golesB=0, y el partido 1 va también en "comodines".

Devolvé SOLAMENTE un objeto JSON (sin texto adicional, sin markdown, sin explicaciones) con este formato exacto:
{"predicciones":[{"numero":1,"golesA":2,"golesB":1}], "comodines":[3,7]}

Reglas:
- "numero" es el número de partido según el fixture de arriba.
- "golesA" son los goles del equipo que figura primero en ese partido del fixture, "golesB" los del que figura segundo. Aunque el mensaje escriba los equipos en otro orden, usá el orden del fixture.
- Incluí en "predicciones" TODOS los partidos del mensaje que tengan un resultado numérico claro. No omitas ninguno: si un partido tiene un resultado, incluílo. Es preferible un error puntual antes que dejar un partido afuera.
- El resultado puede escribirse como "2 - 1", "2-1", "2:1", "2 1", "2 = 1", "2 vs 1", "2x1" o "2 a 1". El equipo y su gol suelen escribirse juntos, por ejemplo "ROSARIO CENTRAL 2 = ALDOSIVI 0" o "ROSARIO CENTRAL 2 ALDOSIVI 0" (sin separador entre equipos). Los números que parecen goles van al equipo que los tiene al lado en el mensaje.
- Si el equipo está mal escrito (por ejemplo "VELEZ SARFIELD" en vez de "VELEZ SARSFIELD"), igual asignalo al partido del fixture que corresponda por contexto o por el número del partido.
- Si el mensaje no tiene número pero sí los equipos, buscá esos equipos en el fixture para asignar el número correcto.
- Si el mensaje no tiene ni número ni equipos, asigná los resultados en el orden en que aparecen (el primero es el partido 1, el segundo el partido 2, etc.).
- "comodines" es la lista de números que el participante marcó como comodín (COMODIN, comodín, C, *, negrita, esté antes o después del resultado). Incluí TODOS los que encuentres.
- No inventes partidos que no estén en el fixture.
- Ignorá saludos, comentarios, nombres propios y emojis (⚽, 👍, 🔥, etc.).
- El JSON debe ser válido: cada elemento del array separado por coma, sin comas finales.`;

  const response = await fetch("/api/parse", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ prompt })
  });
  const data = await response.json();
  if(!response.ok){
    const err = data.error || 'Error del servidor al procesar con IA';
    if(/429|quota|rate|resource.?exhausted|exceeded|limit/i.test(err)){
      throw new Error('Se excedió el límite diario de la IA gratuita. Probá de nuevo más tarde o cargá los pronósticos manualmente.');
    }
    throw new Error(err);
  }
  const textBlocks = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const obj = parseModelJSON(textBlocks);
  return normalizePredictionsData(obj);
}

// ---------- scoring ----------
function outcome(gA, gB){
  if(gA > gB) return 'A';
  if(gA < gB) return 'B';
  return 'E';
}
function pointsFor(pred, real, isWildcard){
  if(pred==null || real==null) return 0;
  if(pred.golesA==null || pred.golesB==null || real.golesA==null || real.golesB==null) return 0;
  let pts = 0;
  if(pred.golesA===real.golesA && pred.golesB===real.golesB) pts = 3;
  else if(outcome(pred.golesA,pred.golesB) === outcome(real.golesA,real.golesB)) pts = 1;
  if(isWildcard) pts *= 2;
  return pts;
}
function computeStandings(prode){
  const rows = [];
  const permitidos = prode.comodinesPermitidos || 0;
  for(const name of Object.keys(prode.participants)){
    const participant = prode.participants[name];
    const preds = participant.predicciones || [];
    const wildcards = new Set(
      (participant.comodines || []).slice().sort((a,b)=>a-b).slice(0, Math.max(0, permitidos))
    );
    let total = 0, exactos = 0, aciertos = 0, jugados = 0;
    for(const m of prode.matches){
      if(m.golesA==null || m.golesB==null) continue;
      jugados++;
      const p = preds.find(x=>x.numero===m.number);
      if(!p) continue;
      const isWildcard = wildcards.has(m.number);
      const pts = pointsFor({golesA:p.golesA, golesB:p.golesB}, {golesA:m.golesA, golesB:m.golesB}, isWildcard);
      if(pts>0){
        if(p.golesA===m.golesA && p.golesB===m.golesB) exactos++;
        else aciertos++;
      }
      total += pts;
    }
    rows.push({name, total, exactos, aciertos, jugados});
  }
  rows.sort((a,b)=>b.total-a.total);
  return rows;
}

// ---------- rendering ----------
function teamsUpper(s){ return (s||'').toUpperCase(); }

function generateCopyText(prode){
  let lines = [];
  if(prode.encabezado) lines.push(prode.encabezado);
  prode.matches.forEach(m=>{
    lines.push(`${m.number}-- ${teamsUpper(m.teamA)} – ${teamsUpper(m.teamB)}`);
  });
  return lines.join('\n');
}

function renderTab(){

  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

      ${names.length ? blocks : '<p class="muted">Todavía no cargaste pronósticos de nadie.</p>'}

// ---------- actions ----------
async function crearFecha(){
  const name = $('#newName').value.trim() || `Fecha ${prodeIndex.length+1}`;
  const prode = defaultProde(name);
  prodeIndex.push({id:prode.id, name:prode.name});
  await saveIndex();
  currentId = prode.id;
  current = prode;
  await saveProde();
  activeTab = 'fixture';
  render();
}

async function pedirNuevaFecha(){
  const name = prompt('Nombre de la nueva fecha:', `Fecha ${prodeIndex.length+1}`);
  if(name===null) return;
  const prode = defaultProde(name.trim() || `Fecha ${prodeIndex.length+1}`);
  prodeIndex.push({id:prode.id, name:prode.name});
  await saveIndex();
  currentId = prode.id;
  current = prode;
  await saveProde();
  activeTab = 'fixture';
  render();
}

async function cambiarFecha(id){
  currentId = id;
  current = await loadProde(id);
  activeTab = 'fixture';
  render();
}

async function borrarFecha(){
  if(!confirm(`¿Eliminar "${current.name}" y todos sus datos? Esta acción no se puede deshacer.`)) return;
  prodeIndex = prodeIndex.filter(p=>p.id!==currentId);
  await saveIndex();
  try{ await storageDelete('prode-data:'+currentId); }catch(e){}
  if(prodeIndex.length){
    currentId = prodeIndex[0].id;
    current = await loadProde(currentId);
  }else{
    currentId = null; current = null;
  }
  render();
}

function editHeader(field, value){
  current[field] = value;
  saveProde();
}

function editMatch(number, field, value){
  const m = current.matches.find(x=>x.number===number);
  if(!m) return;
  m[field] = value;
  saveProde();
  renderTab();
}

function deleteMatch(number){
  current.matches = current.matches.filter(m=>m.number!==number);
  current.matches.forEach((m,i)=>{ m.number = i+1; });
  saveProde();
  renderTab();
}

function agregarMatchManual(){
  current.matches.push({number: current.matches.length+1, teamA:'', teamB:'', golesA:null, golesB:null});
  saveProde();
  renderTab();
}

function agregarBulk(){
  const text = $('#bulkFixture').value;
  const parsed = parseFixtureText(text);
  const offset = current.matches.length;
  parsed.forEach((m,i)=>{
    m.number = offset + i + 1;
    current.matches.push(m);
  });
  saveProde();
  renderTab();
  showToast(`${parsed.length} partidos agregados`);
}

function vaciarFixture(){
  if(!confirm('¿Vaciar todos los partidos del fixture?')) return;
  current.matches = [];
  saveProde();
  renderTab();
}

function editResultado(number, field, value){
  const m = current.matches.find(x=>x.number===number);
  if(!m) return;
  m[field] = value===''? null : parseInt(value,10);
  saveProde();
}

function editPrediccion(name, numero, field, value){
  const participant = current.participants[name];
  if(!participant) return;
  const preds = participant.predicciones;
  let p = preds.find(x=>x.numero===numero);
  if(!p){ p = {numero}; preds.push(p); }
  p[field] = value===''? null : parseInt(value,10);
  saveProde();
}

function toggleComodin(name, numero){
  const participant = current.participants[name];
  if(!participant) return;
  const idx = participant.comodines.indexOf(numero);
  if(idx>=0) participant.comodines.splice(idx,1);
  else participant.comodines.push(numero);
  saveProde();
  renderTab();
}

function borrarParticipante(name){
  if(!confirm(`¿Eliminar a ${name}?`)) return;
  delete current.participants[name];
  participantesAbiertos.delete(name);
  saveProde();
  renderTab();
}

function toggleParticipante(name){
  if(participantesAbiertos.has(name)) participantesAbiertos.delete(name);
  else participantesAbiertos.add(name);
  renderTab();
}

async function procesarConIA(){
  const name = $('#participantName').value.trim();
  const text = $('#participantText').value.trim();
  const statusEl = $('#iaStatus');
  if(!name){ showToast('Falta el nombre del participante'); return; }
  if(!text){ showToast('Falta pegar el mensaje'); return; }
  statusEl.textContent = 'Procesando...';
  $('#btnProcesarIA').disabled = true;
  try{
    const local = parsePredictionsLocal(text, current.matches);
    const scoredLines = text.split('\n').map(l=>l.trim()).filter(l=>/\d/.test(l)).length;
    let parsed, usadoLocal = false, iaFallida = false;
    if(local.predicciones.length >= 1 && local.predicciones.length >= Math.max(1, Math.ceil(scoredLines * 0.5))){
      parsed = local;
      usadoLocal = true;
    }else{
      statusEl.textContent = 'Procesando con IA...';
      try{
        parsed = await parsePredictionsWithAI(text, current.matches);
      }catch(aiErr){
        if(local.predicciones.length >= 1){
          statusEl.textContent = 'IA no disponible, cargando parseo local parcial...';
          parsed = local;
          usadoLocal = true;
          iaFallida = true;
        }else{
          throw aiErr;
        }
      }
    }
    if(!current.participants[name]) current.participants[name] = {predicciones:[], comodines:[]};
    participantesAbiertos.add(name);
    const participant = current.participants[name];
    const preds = participant.predicciones;
    parsed.predicciones.forEach(item=>{
      let p = preds.find(x=>x.numero===item.numero);
      if(!p){ p = {numero:item.numero}; preds.push(p); }
      p.golesA = item.golesA;
      p.golesB = item.golesB;
    });
    if(parsed.comodines.length){
      const set = new Set([...participant.comodines, ...parsed.comodines]);
      participant.comodines = Array.from(set);
    }
    const permitidos = current.comodinesPermitidos || 0;
    let recorteWc = '';
    if(permitidos > 0 && participant.comodines.length > permitidos){
      participant.comodines = participant.comodines.slice().sort((a,b)=>a-b).slice(0, permitidos);
      recorteWc = ` (comodines recortados a los primeros ${permitidos})`;
    }
    await saveProde();
    const total = current.matches.length;
    const n = parsed.predicciones.length;
    const wcMsg = participant.comodines.length ? ` (comodines: ${participant.comodines.join(', ')})` : '';
    const viaMsg = (usadoLocal ? ' [parseo local]' : '') + (iaFallida ? ' [la IA falló, se cargó el parseo local parcial]' : '') + recorteWc;
    if(n < total){
      showToast(`ATENCIÓN: se cargaron solo ${n} de ${total} pronósticos de ${name}${wcMsg}${viaMsg}. Revisá la pestaña Participantes.`);
    }else{
      showToast(`Se cargaron ${n} pronósticos de ${name}${wcMsg}${viaMsg}`);
    }
    $('#participantText').value = '';
    renderTab();
  }catch(e){
    showToast('Error al procesar con IA: ' + e.message);
  }finally{
    $('#btnProcesarIA').disabled = false;
    if(statusEl) statusEl.textContent = '';
  }
}

function cargarVistaPrevia(){
  previewText = generateCopyText(current);
  const el = $('#previewText');
  if(el) el.textContent = previewText;
  showToast('Vista previa actualizada');
}

async function copiarTexto(){
  const text = generateCopyText(current);
  try{
    await navigator.clipboard.writeText(text);
    showToast('Copiado ✅');
  }catch(e){
    if(copiarTextoFallback(text)) showToast('Copiado ✅');
    else showToast('No se pudo copiar automáticamente');
  }
}

function copiarTextoFallback(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

// ---------- init ----------
async function init(){
  await loadIndex();
  if(prodeIndex.length){
    currentId = prodeIndex[0].id;
    current = await loadProde(currentId);
    if(!current){ current = defaultProde(prodeIndex[0].name); current.id = currentId; }
  }
  render();
}
init();
